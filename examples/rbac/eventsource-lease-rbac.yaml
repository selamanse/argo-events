apiVersion: v1
kind: ServiceAccount
metadata:
  name: operate-eventsource-sa
---
# EventSources that use Kubernetes lease-based leader election need access
# to coordination.k8s.io/leases in their namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operate-eventsource-leases-role
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operate-eventsource-leases-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: operate-eventsource-leases-role
subjects:
  - kind: ServiceAccount
    name: operate-eventsource-sa
